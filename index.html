<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ślub Justyny i Adama — wspomnienia muzyczne</title>
    <meta
      name="description"
      content="Wspomnienia muzyczne ze ślubu Justyny i Adama."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">15.08.2026</p>
        <h1>Ślub Justyny i Adama</h1>
        <p class="subtitle">
          Kilka utworów i momentów, które towarzyszyły Wam w tym wyjątkowym dniu.
        </p>
        <div class="divider" aria-hidden="true"></div>
      </header>

      <section id="video-grid" class="video-grid" aria-label="Filmy z YouTube"></section>

      <footer>
        <p>Ze szczęściem dla Justyny i Adama</p>
      </footer>
    </main>

    <script src="videos.js"></script>
    <script>
      const grid = document.getElementById("video-grid");
      const canEmbed =
        window.location.protocol === "http:" ||
        window.location.protocol === "https:";

      function embedUrl(id) {
        const params = new URLSearchParams({ rel: "0" });
        if (window.location.origin && window.location.origin !== "null") {
          params.set("origin", window.location.origin);
        }
        return `https://www.youtube.com/embed/${id}?${params}`;
      }

      function watchUrl(id) {
        return `https://www.youtube.com/watch?v=${id}`;
      }

      if (!VIDEOS.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <p>Filmy pojawią się tutaj wkrótce.</p>
          </div>
        `;
      } else if (!canEmbed) {
        grid.innerHTML = `
          <div class="empty-state">
            <p>
              Aby odtwarzać filmy na stronie, otwórz ją przez lokalny serwer
              (np. <code>python -m http.server 8080</code>) albo opublikuj online.
            </p>
          </div>
        ` + VIDEOS.map(
          (video) => `
            <article class="video-card">
              <a class="video-link" href="${watchUrl(video.id)}" target="_blank" rel="noopener noreferrer">
                <div class="video-wrapper">
                  <img
                    src="https://i.ytimg.com/vi/${video.id}/hqdefault.jpg"
                    alt="${video.title}"
                    loading="lazy"
                  />
                  <span class="play-badge" aria-hidden="true">▶</span>
                </div>
                <h2 class="video-title">${video.title}</h2>
              </a>
            </article>
          `
        ).join("");
      } else {
        grid.innerHTML = VIDEOS.map(
          (video) => `
            <article class="video-card">
              <div class="video-wrapper">
                <iframe
                  src="${embedUrl(video.id)}"
                  title="${video.title}"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allowfullscreen
                  loading="lazy"
                ></iframe>
              </div>
              <h2 class="video-title">${video.title}</h2>
            </article>
          `
        ).join("");
      }
    </script>
  </body>
</html>
